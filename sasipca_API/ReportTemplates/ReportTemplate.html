<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Relatório: {report_title}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 10pt;
            color: #333;
            background: #ffffff;
            padding: 30px;
        }

        .header {
            background: #1a5f3c;
            color: white;
            padding: 30px;
            margin-bottom: 0;
            border-radius: 8px 8px 0 0;
        }

        h1 {
            font-size: 22pt;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .header > p {
            font-size: 10pt;
        }

        .filters {
            font-size: 9pt;
            background: #f5f5f5;
            padding: 20px 30px;
            margin-bottom: 25px;
            border-radius: 0 0 8px 8px;
        }

            .filters h4 {
                color: #1a5f3c;
                font-weight: bold;
                margin-bottom: 10px;
                font-size: 11pt;
            }

            .filters p {
                margin: 5px 0;
            }

            .filters strong {
                color: #1a5f3c;
                font-weight: bold;
            }

        .report-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

            .report-table thead {
                background: #1a5f3c;
            }

            .report-table th {
                background: #1a5f3c;
                color: white;
                padding: 12px 15px;
                font-size: 9.5pt;
                text-align: left;
                font-weight: bold;
                border: 1px solid #1a5f3c;
            }

            .report-table td {
                padding: 10px 15px;
                font-size: 9.5pt;
                border: 1px solid #ddd;
                color: #333;
            }

            .report-table tbody tr:nth-child(even) {
                background-color: #f9f9f9;
            }

        .align-right {
            text-align: right;
        }

        .total-row {
            background: #e8f5ee !important;
            border-top: 2px solid #2d8659 !important;
        }

            .total-row td {
                font-weight: bold;
                color: #1a5f3c;
                font-size: 10pt;
                padding: 12px 15px;
            }

        .footer {
            text-align: right;
            font-size: 8pt;
            color: #666;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>{report_title}</h1>
        <p>Gerado em: {generation_date}</p>
    </div>

    {report_content}

    <div class="footer">
        Documento gerado automaticamente.
    </div>
</body>
</html>
